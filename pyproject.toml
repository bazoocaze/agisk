[project]
name = "agisk"
version = "1.2.5"
description = "Agent Skills — Symbolic link manager for agent skills"
authors = [
    { name = "agisk contributors" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["questionary>=2.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
agisk = "agisk.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
